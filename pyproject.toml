[project]
name = "twitter-rss-feed-to-discord"
version = "0.1.0"
description = "Pooling data from RSS Feed at public or private Nitter instance to Discord Webhook Embed. Now support Discord Component V2 !"
license = {text = "MIT"}
readme = "README.md"
authors = [
    { name = "Kurisutaru" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.4",
    "beautifulsoup4>=4.14.3",
    "discord-py>=2.7.1",
    "feedparser>=6.0.12",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "mashumaro[orjson]>=3.20",
    "python-dateutil>=2.9.0.post0",
]

[project.urls]
Homepage = "https://github.com/Kurisutaru/twitter-rss-feed-to-discord"
Repository = "https://github.com/Kurisutaru/twitter-rss-feed-to-discord"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined vars, etc.)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modernize syntax)
]
ignore = [
    "E501",
    "UP045",
]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]
